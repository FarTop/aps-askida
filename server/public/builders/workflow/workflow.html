<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APS — Workflow Builder</title>
  <link rel="stylesheet" href="../../_shared/css/navbar.css" />
  <link rel="stylesheet" href="../../_shared/css/org-context-selector.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="builder-tokens.css" />
  <link rel="stylesheet" href="workflow.css" />
</head>

<body>

  <!-- Header partagé, régularisé : même ossature que le canvas et les écrans
       Administration (fin du <header> maison + badge « scénario » périmé). -->
  <header class="aps-header">
    <div class="aps-header-left">
      <img src="../../_shared/assets/aps-logo.svg" alt="Askida" class="aps-logo" />
      <span class="breadcrumb"><a href="../../index.html">APS</a> › Workflow Builder</span>
    </div>
    <div class="aps-header-center">
      <div data-role="org-context"></div>
    </div>
    <div class="aps-header-right">
      <nav class="aps-navbar">
        <a class="aps-nav-link" href="../../index.html">Home</a>
      </nav>
    </div>
  </header>

  <div class="page">

    <div class="hero">
      <h1>Workflow Builder</h1>
      <p>Concevez des workflows abstraits, indépendants du moteur qui les exécute.</p>
    </div>

    <main class="grid" aria-label="Workflow Builder">

      <!-- Workflows de l'organisation courante (contexte). -->
      <section class="card">
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>
        <div class="card-hd">
          <div class="card-tt">Workflows de l'organisation</div>
        </div>
        <div class="card-bd">
          <div id="wf-liste" class="bd-liste" aria-live="polite">
            <p class="muted">Chargement…</p>
          </div>
        </div>
        <div class="cta-row">
          <a class="btn" href="workflow-canvas.html">Nouveau workflow</a>
        </div>
      </section>

      <!-- Manifestes de livraison : ressource du domaine Workflow (rattachée ici
           — un manifeste ne sert qu'aux workflows). -->
      <section class="card">
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>
        <div class="card-hd">
          <div class="card-tt">Manifestes de livraison</div>
        </div>
        <div class="card-bd">
          <div id="mf-liste" class="bd-liste" aria-live="polite">
            <p class="muted">Chargement…</p>
          </div>
        </div>
        <div class="cta-row">
          <a class="btn ghost" href="../../admin/manifests/manifests.html">Gérer les manifestes</a>
        </div>
      </section>

    </main>

    <footer class="bd-footer">
      Askida Platform Studio · Workflow Builder
    </footer>

  </div>

  <script src="../../_shared/js/org-context-selector.js"></script>
  <script src="workflow.js"></script>
</body>
</html>
