<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APS — Workflow Builder</title>
  <link rel="stylesheet" href="../../_shared/css/navbar.css" />
  <link rel="stylesheet" href="../../_shared/css/org-context-selector.css" />
  <link rel="stylesheet" href="builder-tokens.css" />
  <link rel="stylesheet" href="workflow.css" />
</head>

<body>

  <header class="aps-header">
    <div class="aps-header-left">
      <img src="../../_shared/assets/aps-logo.svg" alt="Askida" class="aps-logo" />
      <span class="breadcrumb"><a href="../../index.html">APS</a> › Workflow Builder</span>
    </div>
    <div class="aps-header-center">
      <div data-role="org-context"></div>
    </div>
    <div class="aps-header-right">
      <nav class="aps-navbar">
        <a class="aps-nav-link" href="../../index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="wb-main">

    <div class="wb-titre-row">
      <h1 class="wb-titre">Workflow Builder</h1>
    </div>

    <div class="wb-tabs" role="tablist">
      <button class="wb-tab wb-tab-actif" data-tab="workflows" role="tab" type="button">Workflows</button>
      <button class="wb-tab" data-tab="manifests" role="tab" type="button">Manifestes</button>
    </div>

    <section class="wb-panel" data-panel="workflows">
      <div class="wb-panel-tete">
        <span class="wb-panel-info" id="wf-compte"></span>
        <a class="wb-btn wb-btn-accent" href="workflow-canvas.html">Nouveau workflow</a>
      </div>
      <div id="wf-liste" class="wb-liste" aria-live="polite">
        <p class="wb-muted">Chargement…</p>
      </div>
    </section>

    <section class="wb-panel" data-panel="manifests" hidden>
      <div class="wb-panel-tete">
        <span class="wb-panel-info" id="mf-compte"></span>
        <a class="wb-btn" href="../../admin/manifests/manifests.html">Gérer les manifestes</a>
      </div>
      <div id="mf-liste" class="wb-liste" aria-live="polite">
        <p class="wb-muted">Chargement…</p>
      </div>
    </section>

  </main>

  <script src="../../_shared/js/org-context-selector.js"></script>
  <script src="workflow.js"></script>
</body>
</html>
