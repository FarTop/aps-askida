<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APS — Workflow Builder · Canevas</title>
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="builder-tokens.css" />
  <link rel="stylesheet" href="workflow-canvas.css" />
</head>

<body>
  <!-- Canevas plein cadre. Le bandeau haut informe (connexion, environnement,
       statut) mais ne commande pas : les panneaux sont des volets de bord, pas
       des boutons de bandeau. Trois bords portent des volets — gauche pour
       observer (jobs, logs), droite pour paramétrer (config, run), bas pour
       l'API ops (lecture gauche->droite). Chaque volet et ses onglets forment
       une piece solidaire qui coulisse EN SUPERPOSITION par-dessus le canevas
       fixe : le canevas ne bouge jamais quand un volet s'ouvre. -->
  <div class="bd-canvas-root" data-open="" data-active="0" data-dirty="0">

    <!-- Bandeau d'état — informe, ne commande pas. Trois zones hiérarchisées :
         identité (gauche) · contexte (centre) · technique (droite). Le sapin de
         Noël s'évite par la retenue : tout gris/dim, la couleur ne sert qu'aux
         pastilles d'état. Valeurs de DÉMONSTRATION à ce stade (data-demo) ; le
         câblage sur les vraies routes viendra au patch suivant. -->
    <header class="bd-statusbar" aria-label="État" data-demo="1">

      <!-- Identité : nom + version/statut + indicateur non-enregistré -->
      <div class="bd-seg">
        <span class="bd-wf-name" data-role="wf-name">— aucun workflow —</span>
        <span class="bd-badge" data-role="statut" data-state="idle">—</span>
        <span class="bd-dirty" data-role="dirty">
          <span class="bd-dot bd-dot-warn"></span>non enregistré
        </span>
      </div>

      <!-- Contexte : environnement + actualisation, puis cible Engine -->
      <div class="bd-seg bd-env">
        <span class="bd-dot" data-role="env-dot"></span>
        <span class="bd-env-name" data-role="env-name">— environnement —</span>
        <span class="bd-env-org" data-role="env-org"></span>
        <button class="bd-icon-btn" data-role="env-refresh"
                title="Actualiser depuis l'environnement" type="button">↻</button>
      </div>

      <div class="bd-seg">
        <span class="bd-dot" data-role="engine-dot"></span>
        <span class="bd-engine-name" data-role="engine-name">— moteur —</span>
      </div>

      <!-- État actif : segment intégré, apparaît sans rien recouvrir -->
      <div class="bd-lock" data-role="lock">
        <span class="bd-lk" aria-hidden="true">🔒</span>
        <span>Flux actif</span>
        <span class="bd-lock-modif">— <button class="bd-linklike" data-role="deactivate" type="button">désactiver</button> pour modifier</span>
      </div>

      <div class="bd-spacer"></div>

      <!-- Technique : compteurs + snapshot, discrets, à droite -->
      <div class="bd-seg bd-tech">
        <span><b data-role="node-count">0</b> nœuds · <b data-role="conn-count">0</b> connexions</span>
        <span>snapshot <b data-role="snapshot">—</b></span>
      </div>

    </header>

    <!-- Scène : canevas + volets superposés -->
    <div class="bd-stage">

      <!-- Canevas : cadre fixe (.cnv-frame) + surface transformable
           (.cnv-surface). La transformation vit dans la surface, jamais dans le
           cadre : redimensionner ou ouvrir un volet ne bouge aucun noeud. -->
      <main class="cnv-frame" aria-label="Canevas">
        <div class="cnv-surface">
          <svg class="cnv-edges" aria-hidden="true"></svg>
          <div class="cnv-nodes"></div>
        </div>
      </main>

      <!-- Dock gauche : observation. Volet + onglets solidaires + poignée. -->
      <div class="bd-dock bd-dock-left" data-side="left">
        <aside class="bd-panel">
          <div class="bd-panel-hd" data-role="title">Jobs</div>
          <div class="bd-panel-bd"></div>
        </aside>
        <div class="bd-grip" data-side="left"
             role="separator" aria-orientation="vertical" tabindex="0"
             aria-label="Redimensionner le volet gauche"></div>
        <div class="bd-tabs">
          <button class="bd-tab" data-panel="jobs" data-side="left">Jobs</button>
          <button class="bd-tab" data-panel="logs" data-side="left">Logs</button>
        </div>
      </div>

      <!-- Dock droite : paramétrage -->
      <div class="bd-dock bd-dock-right" data-side="right">
        <aside class="bd-panel">
          <div class="bd-panel-hd" data-role="title">Config</div>
          <div class="bd-panel-bd"></div>
        </aside>
        <div class="bd-grip" data-side="right"
             role="separator" aria-orientation="vertical" tabindex="0"
             aria-label="Redimensionner le volet droit"></div>
        <div class="bd-tabs">
          <button class="bd-tab" data-panel="config" data-side="right">Config</button>
          <button class="bd-tab" data-panel="run" data-side="right">Run</button>
        </div>
      </div>

      <!-- Dock bas : API ops (lecture gauche->droite) -->
      <div class="bd-dock bd-dock-bottom" data-side="bottom">
        <aside class="bd-panel">
          <div class="bd-panel-hd" data-role="title">API ops</div>
          <div class="bd-panel-bd"></div>
        </aside>
        <div class="bd-grip" data-side="bottom"
             role="separator" aria-orientation="horizontal" tabindex="0"
             aria-label="Redimensionner le volet bas"></div>
        <div class="bd-tabs">
          <button class="bd-tab" data-panel="api" data-side="bottom">API ops</button>
        </div>
      </div>

    </div>
  </div>

  <script src="pivot-schema.js"></script>
  <script src="pivot-validate.js"></script>
  <script src="pivot-catalog-iconik.js"></script>
  <script src="pivot-io.js"></script>
  <script src="workflow-canvas.js"></script>
</body>
</html>
