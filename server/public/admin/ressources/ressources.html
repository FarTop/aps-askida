<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ressources — APS Administration</title>
  <link rel="stylesheet" href="../../_shared/css/navbar.css" />
  <link rel="stylesheet" href="../../_shared/css/org-context-selector.css" />
  <link rel="stylesheet" href="ressources.css" />
</head>
<body>

  <header class="aps-header">
    <div class="aps-header-left">
      <img src="../../_shared/assets/aps-logo.svg" alt="Askida" class="aps-logo" />
      <span class="breadcrumb"><a href="../../index.html">APS</a> › <a href="#">Administration</a> › Ressources</span>
    </div>
    <div class="aps-header-center">
      <div data-role="org-context"></div>
    </div>
    <div class="aps-header-right">
      <nav class="aps-navbar">
        <a class="aps-nav-link" href="../../index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="adm-main">

    <div class="adm-toolbar">
      <h1 class="adm-title">Ressources</h1>
      <button class="btn" id="btn-new" type="button">+ Nouvelle ressource</button>
    </div>

    <!-- Onglets par type de ressource -->
    <div class="res-tabs" role="tablist">
      <button class="res-tab" data-type="mappings"  role="tab">Correspondances</button>
      <button class="res-tab" data-type="nommages"  role="tab">Nommages</button>
      <button class="res-tab" data-type="contacts"  role="tab">Contacts</button>
    </div>

    <div class="adm-filters">
      <input type="text" id="search" placeholder="Rechercher…" class="adm-search" />
    </div>

    <!-- Liste des ressources du type courant -->
    <div id="res-list" class="res-list" aria-live="polite"></div>

  </main>

  <script src="../../_shared/js/org-context-selector.js"></script>
  <script src="ressources.js"></script>
</body>
</html>
