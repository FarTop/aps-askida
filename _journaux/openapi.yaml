                  example: 123456
                partner:
                  type: string
                  description: ''
                  example: justwatch
                  enum:
                    - amazon
                    - betv
                    - free
                    - molotov
                    - allocine
                    - justwatch
                    - samsung
                type:
                  type: string
                  description: ''
                  example: bonus
                  enum:
                    - main
                    - bonus
                    - trailer
                url:
                  type: string
                  description: 'The url (http or s3://) to the video. Max 1000 characters.'
                  example: 's3://bucket/path/to/video.mp4'
                  enum:
                    - mp4
                    - mov
                    - ts
                    - mpeg
                    - mpg
                    - mxf
                dash_url:
                  type: string
                  description: 'Must be a valid URL. Must end with one of <code>.mpd</code> Must not be greater than 1000 characters.'
                  example: 'https://www.kulas.com/et-cupiditate-saepe-amet-odit-earum'
                  nullable: true
                is_drmised:
                  type: boolean
                  description: 'The video has DRM.'
                  example: false
                drm_key_id:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: qeilmwjjryfojecjbp
                  nullable: true
                drm_key:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: yseakhlixgypxjgpoejj
                  nullable: true
                drm_initialization_vector:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: fdzvsydzqvfnaodgytuyu
                  nullable: true
                duration:
                  type: integer
                  description: 'The duration in seconds.'
                  example: 3600
                due_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-08-13T14:02:43'
                  nullable: true
                subtitles:
                  type: array
                  description: ''
                  example: null
                  items:
                    type: object
                    properties:
                      external_id:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: hdafixxamhkdjziszarykizf
                      language_code:
                        type: string
                        description: 'The language code.'
                        example: fr-FR
                      version:
                        type: string
                        description: ''
                        example: forced
                        enum:
                          - normal
                          - sdh
                          - forced
                        nullable: true
                      url:
                        type: string
                        description: 'The url (http or s3://) to the subtitle.'
                        example: 'http://path/to/subtitle_fr.vtt'
                        enum:
                          - srt
                          - vtt
                          - ttml
                    required:
                      - external_id
                      - language_code
                      - url
                audios:
                  type: array
                  description: ''
                  example: null
                  items:
                    type: object
                    properties:
                      external_id:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: aahfxkdnjpejbjvemfrpyzgz
                      language_code:
                        type: string
                        description: 'The language code.'
                        example: fr-FR
                      url:
                        type: string
                        description: 'The url (http or s3://) to the audio.'
                        example: 'http://path/to/audio_fr.wav'
                        enum:
                          - wav
                          - mp4
                          - mov
                    required:
                      - external_id
                      - language_code
                      - url
                audiotracks:
                  type: array
                  description: ''
                  example: null
                  items:
                    type: object
                    properties:
                      language_code:
                        type: string
                        description: 'The language code.'
                        example: fr-FR
                      is_original_version:
                        type: boolean
                        description: ''
                        example: true
                        nullable: true
                    required:
                      - language_code
                timecodes:
                  type: array
                  description: ''
                  example: null
                  items:
                    type: object
                    properties:
                      external_id:
                        type: string
                        description: 'Must not be greater than 255 characters.'
